<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wird icon: a W monogram drawn as two overlapping ribbons that share the
       middle peak. Palette: app navy tile, cream and Quran-amber ribbons. -->
  <defs>
    <linearGradient id="wird-cream" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FBF6E4"/>
      <stop offset="1" stop-color="#E9DCAC"/>
    </linearGradient>
    <linearGradient id="wird-gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F0D77E"/>
      <stop offset="1" stop-color="#D9AE3C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05192D"/>
  <path d="M256 220 L296 356 L372 158" fill="none" stroke="url(#wird-gold)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 160 L216 356 L256 220" fill="none" stroke="url(#wird-cream)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
