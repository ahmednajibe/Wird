<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wird icon, small-size variant (16 and 24 px): the same ribbon W as
       wird.svg with heavier strokes and a slightly larger mark. -->
  <defs>
    <linearGradient id="wird-cream" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FBF6E4"/>
      <stop offset="1" stop-color="#E9DCAC"/>
    </linearGradient>
    <linearGradient id="wird-gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F0D77E"/>
      <stop offset="1" stop-color="#D9AE3C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05192D"/>
  <path d="M256 205 L300 366 L388 140" fill="none" stroke="url(#wird-gold)" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M124 144 L212 366 L256 205" fill="none" stroke="url(#wird-cream)" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
